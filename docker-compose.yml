version: "3.8"

services:
  backend:
    build:
      context: ./gestione-spese
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5207:8080"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend-gestione-spese
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
